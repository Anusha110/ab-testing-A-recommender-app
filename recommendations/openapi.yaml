openapi: 3.0.3
info:
  title: Music Recommender API
  version: 1.1.0
  description: Public endpoints; requests are rate limited per client IP.
paths:
  /search/:
    get:
      summary: Search Spotify tracks in the local catalog
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Matching tracks available in the local catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchTrack'
        '400':
          description: Invalid or missing query.
        '429':
          description: Request rate limit exceeded.
        '503':
          description: Spotify search is temporarily unavailable.
  /:
    get:
      summary: Serve the music recommender frontend
      responses:
        '200':
          description: The main HTML page.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Generate up to ten recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            encoding:
              track_ids:
                style: form
                explode: true
              genres:
                style: form
                explode: true
      responses:
        '200':
          description: Recommended tracks; an empty array means no matches.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/PlaylistTrack'
        '400':
          description: Invalid request fields.
        '429':
          description: Request rate limit exceeded.
components:
  schemas:
    RecommendationRequest:
      type: object
      required: [mood, start_year, end_year]
      properties:
        track_ids:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9]{22}$'
        genres:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
        mood:
          type: string
          enum: [happy, neutral, sad]
        start_year:
          type: integer
          minimum: 1900
        end_year:
          type: integer
          minimum: 1900
          description: Must be greater than or equal to start_year. Both years cannot exceed the current year.
    SearchTrack:
      type: object
      required: [track_id, track_name, artist_name, genre]
      properties:
        track_id:
          type: string
        track_name:
          type: string
        artist_name:
          type: string
        genre:
          type: string
    PlaylistTrack:
      type: object
      required: [track_id, track_name, title, artist_names, artist, duration_ms, duration, genre, year, similarity_score]
      properties:
        track_id:
          type: string
        track_name:
          type: string
        title:
          type: string
        artist_names:
          type: string
        artist:
          type: string
        duration_ms:
          type: integer
        duration:
          type: string
        genre:
          type: string
        year:
          type: integer
        similarity_score:
          type: number
          nullable: true
